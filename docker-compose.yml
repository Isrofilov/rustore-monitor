services:
  rustore-bot:
    image: isrofilov/rustore-monitor:latest
    container_name: rustore-monitor
    restart: unless-stopped
    environment:
      - RUSTORE_KEY_ID=${RUSTORE_KEY_ID}
      - RUSTORE_PRIVATE_KEY=${RUSTORE_PRIVATE_KEY}
      - RUSTORE_PACKAGE_NAME=${RUSTORE_PACKAGE_NAME}
      - RUSTORE_APP_ID=${RUSTORE_APP_ID}
      - RUSTORE_APPS=${RUSTORE_APPS}
      - TELEGRAM_DOMAIN=${TELEGRAM_DOMAIN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_THREAD_ID=${TELEGRAM_THREAD_ID}
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER}
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN}
      - MATRIX_ROOM_ID=${MATRIX_ROOM_ID}
      - POLL_INTERVAL=${POLL_INTERVAL}
      - TZ_OFFSET=${TZ_OFFSET}
      - PAYMENTS_LOOKBACK_DAYS=${PAYMENTS_LOOKBACK_DAYS}
      - CHECK_VERSIONS=${CHECK_VERSIONS}
      - CHECK_ACCESS=${CHECK_ACCESS}
      - CHECK_SUBSCRIPTIONS=${CHECK_SUBSCRIPTIONS}
      - DIGEST_DAILY=${DIGEST_DAILY}
      - DIGEST_WEEKLY=${DIGEST_WEEKLY}
      - DIGEST_WEEKLY_DAY=${DIGEST_WEEKLY_DAY}
      - DIGEST_TIME=${DIGEST_TIME}
      - ALERT_AFTER_FAILURES=${ALERT_AFTER_FAILURES}
    volumes:
      - rustore-monitor:/data

volumes:
  rustore-monitor:
